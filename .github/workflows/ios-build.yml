# 手动双平台出包，不改变既有 TestFlight 流程，也不在每次 push 时消耗 macOS runner。
# IPA 未签名；APK 使用临时 Debug 签名，均不用于正式发行。
name: Build Mobile Apps

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        required: true
        default: both
        options:
          - both
          - ios
          - android

permissions:
  contents: read

jobs:
  ios:
    name: Build unsigned IPA
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' }}
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify Xcode toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/V2EX-iphoneos"
          xcodebuild \
            -project V2EX.xcodeproj \
            -scheme V2EX \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/V2EX-DerivedData" \
            CONFIGURATION_BUILD_DIR="$BUILD_DIR" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/V2EX-iphoneos/V2EX.app"
          IPA_DIR="$RUNNER_TEMP/V2EX-unsigned-ipa"
          IPA_PATH="$RUNNER_TEMP/V2EX-unsigned.ipa"

          test -d "$APP_PATH"
          test ! -d "$APP_PATH/_CodeSignature"
          test ! -f "$APP_PATH/embedded.mobileprovision"

          rm -rf "$IPA_DIR" "$IPA_PATH"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/"
          (
            cd "$IPA_DIR"
            /usr/bin/zip -qry "$IPA_PATH" Payload
          )

          /usr/bin/unzip -l "$IPA_PATH"

      - name: Upload unsigned IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V2EX-unsigned-ipa-${{ github.sha }}
          path: ${{ runner.temp }}/V2EX-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build debug APK
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Lint debug variant
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Verify APK signature and metadata
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK_PATH"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: V2EX-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: V2EX-android-reports-${{ github.sha }}
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 7
