# 仅手动构建 Android，不启动或等待 iOS workflow。
# Release 变体启用混淆和资源压缩；未配置发布密钥时仍使用临时 Debug 签名。
name: Build Android App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      # JVM 单测沿用工程已启用的 Debug 测试入口，不执行 assembleDebug。
      - name: Test and build release APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Lint release variant
        run: ./gradlew --no-daemon :app:lintRelease

      - name: Verify APK signature and metadata
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK_PATH"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK_PATH"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK_PATH"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: V2EX-release-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload Android verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: V2EX-android-reports-${{ github.sha }}
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/reports/lint-results-release.*
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 7
